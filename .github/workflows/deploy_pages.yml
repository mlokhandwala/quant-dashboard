name: Autonomous Quant Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  schedule:
    # 09:30 AM, 12:30 PM, 03:30 PM IST (04:00, 07:00, 10:00 UTC) Mon-Fri
    - cron: '0 4,7,10 * * 1-5'
    # Daily Post-Market Close at 06:30 PM IST (13:00 UTC) Mon-Fri
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Data Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run Autonomous Macro Ingestion Pipeline
        run: |
          python scripts/update_macro_pipeline.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build and Export Static Next.js App
        run: npm run build
        env:
          NODE_ENV: production

      - name: Commit Fresh Datasets if Changed (on scheduled runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-refresh live macro & market datasets [skip ci]"
            git push origin main
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-data-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
